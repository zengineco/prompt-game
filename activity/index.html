<!DOCTYPE html>
<!--
============================================================
PROMPT — Discord Activity (Vite entry) v0.3.0
Live multiplayer green-terminal Embedded App, now in a 90s CRT monitor.
f-keys.com
============================================================
NOTE: No AdSense (Discord sandbox/ToS). Fonts bundled via @fontsource.
      Logic in src/main.js; styles in src/style.css.
      Bezel/glass/chin = the CRT shell; #game is rendered per-phase by main.js.
============================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROMPT</title>
</head>
<body>
  <!-- CRT monitor shell -->
  <div class="crt-frame">
    <div class="crt-screen">
      <div class="fx-flash" id="fx-flash"></div><!-- channel-change transition flash -->
      <main class="screen">
        <div class="topbar">
          <span class="title">PROMPT</span>
          <span class="zg-monogram">FK</span>
        </div>

        <pre class="boot" id="boot"></pre>
        <div class="link-status" id="link-status"></div>

        <div id="game"><!-- rendered per-phase by main.js --></div>

        <div class="scoreboard" id="scoreboard"></div>

        <footer>f-keys.com | © 2026</footer>
      </main>
    </div>
    <div class="crt-chin">
      <span class="crt-brand">F-KEYS FK-9000</span>
      <span class="crt-power" title="power"></span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
