# ============================================================
# Deploy PROMPT Activity to GitHub Pages (custom domain: prompt.f-keys.com)
# Builds activity/ with Vite and publishes the dist/ to Pages on every push to main.
# f-keys.com
# ============================================================
name: Deploy Activity

# Node 20 is deprecated for JS actions (forced to Node 24 on 2026-06-16); opt in now.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths:
      - 'activity/**'
      - '.github/workflows/deploy-activity.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: activity/package-lock.json
      - name: Install deps
        working-directory: activity
        run: npm ci
      - name: Build
        working-directory: activity
        run: npm run build
        env:
          # All public (App ID + Supabase anon key, protected by RLS); baked in at build time
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: activity/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
